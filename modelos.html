<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Modelos por etapa | Defensoría</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <!-- Quill editor -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
  <style>
  :root {
    --tinta: #14324b; --tinta-2: #22394d; --apagado: #5d7388; --borde: #dbe3ea;
    --ambar: #f0a020; --ambar-suave: #fff3dc; --acento: #14324b;
    --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
    --sans: 'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --radio: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body { font-family: var(--sans); background: #fff; color: var(--tinta); line-height: 1.6;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--ambar); outline-offset: 2px; border-radius: 6px; }

  .cabecera { border-bottom: 1px solid var(--borde); }
  .cabecera-interior { max-width: 1280px; margin: 0 auto; padding: clamp(1.1rem, 2.5vw, 1.75rem) clamp(1rem, 4vw, 2.5rem); }
  .cabecera h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(1.6rem, 3.6vw, 2.4rem); line-height: 1.1; letter-spacing: -.01em; }

  .estructura { max-width: 1280px; margin: 0 auto; padding: clamp(1rem, 3vw, 2rem) clamp(1rem, 4vw, 2.5rem) 3rem;
    display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: clamp(1.25rem, 3vw, 2.5rem); align-items: start; }
  .categorias { position: sticky; top: 1rem; display: flex; flex-direction: column; gap: .5rem; list-style: none;
    max-height: calc(100vh - 2rem); overflow-y: auto; padding-right: 4px; scrollbar-width: thin; }
  .grupo-materia { margin-top: .6rem; font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--acento); }
  .grupo-materia:first-child { margin-top: 0; }
  .tarjeta-categoria { width: 100%; text-align: left; background: #fff; border: 1px solid var(--borde); border-left: 5px solid var(--acento);
    border-radius: var(--radio); padding: .75rem 1rem; display: grid; transition: background .15s, box-shadow .15s; -webkit-tap-highlight-color: transparent; }
  .tarjeta-categoria:hover { background: #fafcfe; }
  .categoria-titulo { font-weight: 600; font-size: .95rem; line-height: 1.3; color: var(--acento); }
  .tarjeta-categoria.activo { background: var(--acento); border-color: var(--acento); box-shadow: 0 8px 22px -10px var(--acento); }
  .tarjeta-categoria.activo .categoria-titulo { color: #fff; }
  .sin-resultados { padding: .3rem .2rem; color: var(--apagado); font-size: .9rem; font-style: italic; }

  .columna-detalle { background: #fff; border: 1px solid var(--borde); border-radius: 22px; overflow: hidden; min-height: 60vh; scroll-margin-top: 5rem; }
  .encabezado-panel { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; padding: clamp(1.25rem, 3vw, 2.25rem);
    border-top: 6px solid var(--acento); border-bottom: 1px solid var(--borde); background: linear-gradient(#fff, #fafcfe); }
  #procesoSeleccionadoNombre { font-family: var(--serif); font-weight: 600; font-size: clamp(1.5rem, 3.2vw, 2.3rem); line-height: 1.15; }
  #subMateriaProceso { margin-top: .5rem; color: var(--apagado); font-size: clamp(.9rem, 1.4vw, 1rem); }
  .btn-nuevo-modelo { background: var(--tinta); color: #fff; border: 1.5px solid var(--tinta); border-radius: 999px; padding: .55rem 1.1rem;
    font-weight: 600; font-size: .9rem; white-space: nowrap; transition: background .15s, color .15s; }
  .btn-nuevo-modelo:hover { background: #fff; color: var(--tinta); }
  .btn-nuevo-modelo:active { transform: scale(.97); }

  .contenido { padding: clamp(1.25rem, 3vw, 2.25rem); max-width: 80ch; display: grid; gap: 1.25rem; }
  .search-input { width: 100%; padding: .65rem 1rem; border: 1.5px solid var(--borde); border-radius: 999px; background: #fafcfe; font-size: .95rem; }
  .search-input:focus { outline: none; border-color: var(--tinta); background: #fff; box-shadow: 0 0 0 3px var(--ambar-suave); }
  .etapas { list-style: none; display: grid; gap: .8rem; }
  .etapa-card { padding: 1rem 1.15rem; background: #fafcfe; border: 1px solid var(--borde); border-left: 5px solid var(--acento); border-radius: 12px; animation: cambio .28s ease; }
  @keyframes cambio { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .etapa-numero { display: block; font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--acento); }
  .etapa-titulo { font-family: var(--serif); font-weight: 600; font-size: clamp(1.15rem, 1.8vw, 1.3rem); line-height: 1.3; margin: .15rem 0 .3rem; }
  .descripcion-etapa { font-size: .97rem; line-height: 1.5; color: var(--tinta-2); }
  .modelo-info { margin-top: .8rem; padding-top: .8rem; border-top: 1px solid var(--borde); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .6rem; }
  .modelo-titulo { font-weight: 600; font-size: .88rem; background: #fff; border: 1px solid var(--borde); border-radius: 999px; padding: .3rem .85rem; word-break: break-word; max-width: 100%; }
  .modelo-titulo.vacio { color: var(--apagado); font-weight: 500; background: #f3f6f9; }
  .botones-modelo { display: flex; gap: .5rem; flex-wrap: wrap; }
  .btn-mostrar, .btn-crear { border-radius: 999px; padding: .4rem 1rem; font-weight: 600; font-size: .85rem; transition: background .15s, color .15s; }
  .btn-mostrar { background: transparent; border: 1.5px solid var(--acento); color: var(--acento); }
  .btn-mostrar:hover { background: var(--acento); color: #fff; }
  .btn-crear { background: var(--ambar-suave); border: 1.5px solid var(--ambar); color: var(--tinta); }
  .btn-crear:hover { background: var(--ambar); }
  .resumen { background: var(--ambar-suave); border-left: 5px solid var(--ambar); border-radius: 0 var(--radio) var(--radio) 0; padding: .9rem 1.15rem; font-size: .95rem; color: var(--tinta-2); }
  .loading-spinner { text-align: center; padding: 2rem; color: var(--apagado); }

  /* Modales */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(10,30,50,.65); backdrop-filter: blur(3px); justify-content: center; align-items: center; z-index: 1000; padding: 1rem; }
  .modal-content { background: #fff; padding: clamp(1.25rem, 4vw, 2rem); border-radius: 24px; width: 100%; max-width: 850px; max-height: 100%; overflow-y: auto; box-shadow: 0 30px 80px -20px rgba(10,30,50,.5); }
  .modal-header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.1rem; padding-bottom: .8rem; border-bottom: 1px solid var(--borde); }
  .modal-header h2 { font-family: var(--serif); font-weight: 600; font-size: 1.5rem; line-height: 1.2; }
  .close-btn { flex: none; width: 2.5rem; height: 2.5rem; border-radius: 50%; border: 0; background: #f3f6f9; font-size: 1.5rem; line-height: 1; color: var(--tinta); }
  .close-btn:hover { background: var(--borde); }
  .form-group { margin-bottom: 1rem; }
  .form-group label { display: block; margin-bottom: .3rem; font-weight: 600; font-size: .88rem; }
  .form-group input, .form-group select { width: 100%; padding: .6rem .9rem; border: 1.5px solid var(--borde); border-radius: 12px; background: #fff; font-size: .95rem; }
  .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--tinta); box-shadow: 0 0 0 3px var(--ambar-suave); }
  .form-group select:disabled { background: #f3f6f9; color: var(--apagado); }
  .ql-container { font-family: var(--sans); font-size: .97rem; }
  .ql-toolbar.ql-snow { border: 1.5px solid var(--borde); border-radius: 12px 12px 0 0; background: #fafcfe; }
  #bodyEditorQuill { min-height: 220px; background: #fff; border: 1.5px solid var(--borde); border-top: 0; border-radius: 0 0 12px 12px; }
  .form-actions, .acciones-documento { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: .6rem; margin-top: 1.25rem; }
  .btn-save, .btn-cancel-modal, .btn-editar-doc, .btn-imprimir-doc { border-radius: 999px; padding: .55rem 1.2rem; font-weight: 600; font-size: .9rem; border: 1.5px solid var(--tinta); transition: background .15s, color .15s; }
  .btn-save, .btn-editar-doc { background: var(--tinta); color: #fff; }
  .btn-save:hover, .btn-editar-doc:hover { background: #0d2336; }
  .btn-cancel-modal, .btn-imprimir-doc { background: transparent; color: var(--tinta); }
  .btn-cancel-modal:hover, .btn-imprimir-doc:hover { background: #f3f6f9; }
  .documento-completo { font-size: .97rem; line-height: 1.6; }
  .doc-meta { background: #fafcfe; border: 1px solid var(--borde); border-left: 5px solid var(--ambar); border-radius: 12px; padding: .9rem 1.1rem; margin-bottom: 1rem; font-size: .9rem; display: grid; gap: .2rem; }
  .doc-contenido { border-top: 1px solid var(--borde); padding-top: 1rem; }

  @media (max-width: 1024px) { .estructura { grid-template-columns: minmax(230px, 280px) minmax(0, 1fr); } }
  @media (max-width: 760px) {
    .estructura { grid-template-columns: 1fr; gap: 1rem; }
    .categorias { position: sticky; top: 0; z-index: 20; flex-direction: row; overflow-x: auto; gap: .5rem; max-height: none;
      margin: 0 calc(-1 * clamp(1rem, 4vw, 2.5rem)); padding: .6rem clamp(1rem, 4vw, 2.5rem);
      background: rgba(255,255,255,.95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--borde); scroll-snap-type: x proximity; scrollbar-width: none; }
    .categorias::-webkit-scrollbar { display: none; }
    .categorias li { flex: 0 0 auto; scroll-snap-align: start; }
    .grupo-materia, .sin-resultados { display: none; }
    .tarjeta-categoria { width: auto; border-left-width: 1px; border-bottom: 4px solid var(--acento); padding: .55rem .9rem; border-radius: 12px; }
    .categoria-titulo { font-size: .85rem; white-space: nowrap; }
    .columna-detalle { min-height: 0; border-radius: 18px; scroll-margin-top: 4.5rem; }
  }
  @media (max-width: 560px) { .encabezado-panel { flex-direction: column; } }
  @media (min-width: 1500px) { html { font-size: 17px; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
<header class="cabecera">
  <div class="cabecera-interior"><h1>Redacción de documentos</h1></div>
</header>

<div class="estructura">
  <ul class="categorias" id="contenedorMaterias" aria-label="Procesos por materia"></ul>

  <main class="columna-detalle" id="panelEscritos" aria-live="polite">
    <div class="encabezado-panel cabecera-proceso">
      <div class="info-proceso">
        <h2 id="procesoSeleccionadoNombre">Seleccione un proceso</h2>
        <p id="subMateriaProceso">Los procesos se crean al guardar un modelo</p>
      </div>
      <button class="btn-nuevo-modelo" id="btnNuevoModeloGlobal" type="button">+ Nuevo modelo</button>
    </div>
    <div class="contenido">
      <input type="search" id="searchModelos" class="search-input" placeholder="Buscar modelo..." aria-label="Buscar modelo" autocomplete="off">
      <div id="etapasDinamicasContainer">
        <div class="resumen">Seleccione un proceso del listado.</div>
      </div>
    </div>
  </main>
</div>

<!-- MODAL para crear/editar modelo -->
<div id="modalModelo" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitleModelo">Modelo de escrito</h2>
      <button class="close-btn" id="closeModalBtnModelo">&times;</button>
    </div>
    <form id="etapaModelForm">
      <input type="hidden" id="modeloDocId">
      <input type="hidden" id="materiaHidden">
      <input type="hidden" id="procesoHidden">
      <input type="hidden" id="etapaHidden">
      <div class="form-group">
        <label for="materiaModelo">Materia *</label>
        <select id="materiaModelo" required>
          <option value="">Seleccionar materia</option>
          <option value="FAMILIA">⚖️ FAMILIA</option>
          <option value="CIVIL">⚖️ CIVIL</option>
          <option value="LABORAL">⚖️ LABORAL</option>
          <option value="VIOLENCIA FAMILIAR">⚖️ VIOLENCIA FAMILIAR</option>
        </select>
      </div>
      <div class="form-group">
        <label for="procesoLibre">Nombre del proceso *</label>
        <input type="text" id="procesoLibre" required placeholder="Ej: Divorcio contencioso">
      </div>
      <div class="form-group">
        <label for="etapaModelo">Etapa procesal *</label>
        <select id="etapaModelo" required>
          <option value="Etapa inicial">Etapa inicial</option>
          <option value="Etapa de Contestación">Etapa de Contestación</option>
          <option value="Etapa probatoria">Etapa probatoria</option>
          <option value="Etapa Recursiva">Etapa Recursiva</option>
        </select>
      </div>
      <div class="form-group">
        <label for="tipoDocumento">Tipo de documento *</label>
        <select id="tipoDocumento" required>
          <option value="">Seleccionar</option>
          <option value="Escrito">Escrito</option>
          <option value="Oficio">Oficio</option>
          <option value="Cédula">Cédula</option>
          <option value="Mandamiento">Mandamiento</option>
          <option value="Cédula Ley">Cédula Ley</option>
          <option value="Oficio Ley">Oficio Ley</option>
          <option value="Mandamiento Ley">Mandamiento Ley</option>
          <option value="Dictamen">Dictamen</option>
        </select>
      </div>
      <div class="form-group">
        <label for="tituloModelo">Título del modelo *</label>
        <input type="text" id="tituloModelo" required>
      </div>
      <div class="form-group">
        <label for="thematicModelo">Temática *</label>
        <select id="thematicModelo" required>
          <option value="">Seleccionar</option>
          <option value="Civil">Civil</option>
          <option value="Penal">Penal</option>
          <option value="Laboral">Laboral</option>
          <option value="Familia">Familia</option>
          <option value="Administrativo">Administrativo</option>
          <option value="Violencia Familiar">Violencia Familiar</option>
          <option value="Otro">Otro</option>
        </select>
      </div>
      <div class="form-group">
        <label for="leyModelo">Ley / Normativa</label>
        <input type="text" id="leyModelo">
      </div>
      <div class="form-group">
        <label>Cuerpo del escrito *</label>
        <div id="bodyEditorQuill"></div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn-cancel-modal" id="cancelModalBtn">Cancelar</button>
        <button type="submit" class="btn-save">Guardar modelo</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL unificado para MOSTRAR documento (ver + acciones editar/imprimir, sin eliminar) -->
<div id="modalVerDocumento" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h2>📄 Documento completo</h2>
      <button class="close-btn" id="closeVerModal">&times;</button>
    </div>
    <div id="contenidoVerDocumento"></div>
    <div class="acciones-documento">
      <button id="btnEditarDesdeVer" class="btn-editar-doc">✏️ Editar</button>
      <button id="btnImprimirDesdeVer" class="btn-imprimir-doc">🖨️ Imprimir</button>
    </div>
  </div>
</div>

<script>
  // Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyAchXP14PPlBLGFdJhQG-ABvCZEvxtExP0",
    authDomain: "modelosvarios6.firebaseapp.com",
    projectId: "modelosvarios6",
    storageBucket: "modelosvarios6.firebasestorage.app",
    messagingSenderId: "1020516092766",
    appId: "1:1020516092766:web:56954ecc35055fff901dcf"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const modelosEtapaCollection = db.collection('modelosEtapa');

  const etapasFijas = [
    { numero: 1, nombre: "Etapa inicial", descripcion: "Redacción de demanda, poder especial, medidas cautelares urgentes, anexos documentales y solicitud de gratuidad." },
    { numero: 2, nombre: "Etapa de Contestación", descripcion: "Respuesta al traslado de la demanda, excepciones, reconvención y ofrecimiento de prueba." },
    { numero: 3, nombre: "Etapa probatoria", descripcion: "Producción de prueba: testimonial, pericial, documental, informes, absolución de posiciones." },
    { numero: 4, nombre: "Etapa Recursiva", descripcion: "Interposición de recursos ordinarios o extraordinarios (apelación, queja, casación)." }
  ];

  const COLORES = { "FAMILIA": "#1e4a6b", "CIVIL": "#2c7da0", "LABORAL": "#d35400", "VIOLENCIA FAMILIAR": "#8e44ad" };
  let currentMateria = "", currentProceso = "";
  let quillEditor = null;
  let currentDocumentoData = null;

  function initQuillEditor() {
    if (!quillEditor) {
      quillEditor = new Quill('#bodyEditorQuill', {
        theme: 'snow',
        placeholder: 'Escriba el contenido del documento...',
        modules: { toolbar: true }
      });
    }
  }

  async function obtenerProcesosUnicos() {
    try {
      const snapshot = await modelosEtapaCollection.get();
      const procesosMap = new Map();
      snapshot.docs.forEach(doc => {
        const data = doc.data();
        const materia = data.materia;
        const proceso = data.proceso;
        if (materia && proceso) {
          if (!procesosMap.has(materia)) procesosMap.set(materia, new Set());
          procesosMap.get(materia).add(proceso);
        }
      });
      const resultado = {};
      const ordenMaterias = ["FAMILIA", "CIVIL", "LABORAL", "VIOLENCIA FAMILIAR"];
      for (const mat of ordenMaterias) {
        resultado[mat] = procesosMap.has(mat) ? Array.from(procesosMap.get(mat)).sort() : [];
      }
      return resultado;
    } catch (error) {
      console.error(error);
      return { "FAMILIA": [], "CIVIL": [], "LABORAL": [], "VIOLENCIA FAMILIAR": [] };
    }
  }

  async function construirSidebarDinamico() {
    const contenedor = document.getElementById('contenedorMaterias');
    if (!contenedor) return;
    const procesosPorMateria = await obtenerProcesosUnicos();
    let html = '';
    for (const [materiaKey, procesos] of Object.entries(procesosPorMateria)) {
      const color = COLORES[materiaKey] || '#14324b';
      html += `<li class="grupo-materia" style="--acento:${color}">${escapeHtml(materiaKey)}</li>`;
      if (!procesos.length) html += `<li class="sin-resultados vacio">Sin procesos aún</li>`;
      else procesos.forEach(proc => {
        html += `<li><button type="button" class="tarjeta-categoria proceso-enlace" style="--acento:${color}" data-materia="${escapeHtmlAttr(materiaKey)}" data-proceso="${escapeHtmlAttr(proc)}"><span class="categoria-titulo">${escapeHtml(proc)}</span></button></li>`;
      });
    }
    contenedor.innerHTML = html;

    document.querySelectorAll('.proceso-enlace:not(.vacio)').forEach(el => {
      el.addEventListener('click', async (ev) => {
        document.querySelectorAll('.proceso-enlace').forEach(e => e.classList.remove('activo'));
        el.classList.add('activo');
        const panel = document.getElementById('panelEscritos');
        panel.style.setProperty('--acento', COLORES[el.getAttribute('data-materia')] || '#14324b');
        if (ev.isTrusted && matchMedia('(max-width:760px)').matches) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        currentMateria = el.getAttribute('data-materia');
        currentProceso = el.getAttribute('data-proceso');
        document.getElementById('procesoSeleccionadoNombre').innerText = currentProceso;
        document.getElementById('subMateriaProceso').innerHTML = `Materia: ${currentMateria} · Modelos por etapa`;
        document.getElementById('searchModelos').value = '';
        await renderizarPanelConEtapas(currentMateria, currentProceso, '');
      });
    });
    const previo = [...document.querySelectorAll('.proceso-enlace')].find(e => e.dataset.materia === currentMateria && e.dataset.proceso === currentProceso);
    const primerProceso = previo || document.querySelector('.proceso-enlace:not(.vacio)');
    if (primerProceso) primerProceso.click();
    else {
      document.getElementById('etapasDinamicasContainer').innerHTML = '<div class="resumen">No hay procesos creados. Comience con "+ Nuevo modelo".</div>';
    }
  }

  function escapeHtmlAttr(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  async function fetchModeloEtapa(materia, proceso, etapaNombre) {
    try {
      const snapshot = await modelosEtapaCollection.where("materia", "==", materia).where("proceso", "==", proceso).where("etapa", "==", etapaNombre).limit(1).get();
      if (!snapshot.empty) return { id: snapshot.docs[0].id, ...snapshot.docs[0].data() };
      return null;
    } catch (error) { console.error(error); return null; }
  }

  async function saveModeloEtapa(modeloData, docId = null) {
    try {
      if (docId) await modelosEtapaCollection.doc(docId).update(modeloData);
      else await modelosEtapaCollection.add(modeloData);
      return true;
    } catch (error) { console.error(error); alert("Error al guardar: " + error.message); return false; }
  }

  function filtrarModelosSegunBusqueda(modelosData, busqueda) {
    if (!busqueda.trim()) return modelosData;
    const lower = busqueda.toLowerCase();
    return modelosData.filter(mod => 
      (mod.titulo && mod.titulo.toLowerCase().includes(lower)) ||
      (mod.categoria && mod.categoria.toLowerCase().includes(lower)) ||
      (mod.thematic && mod.thematic.toLowerCase().includes(lower)) ||
      (mod.ley && mod.ley.toLowerCase().includes(lower)) ||
      (mod.cuerpo && mod.cuerpo.toLowerCase().includes(lower))
    );
  }

  async function renderizarPanelConEtapas(materiaNombre, procesoNombre, filtroTexto = "") {
    const contenedorEtapas = document.getElementById('etapasDinamicasContainer');
    if (!contenedorEtapas) return;
    contenedorEtapas.innerHTML = '<div class="loading-spinner">Cargando modelos...</div>';
    
    const resultados = await Promise.all(etapasFijas.map(async (etapa) => {
      const modelo = await fetchModeloEtapa(materiaNombre, procesoNombre, etapa.nombre);
      return { etapa, modelo };
    }));
    
    let html = '', visibles = 0;
    for (const item of resultados) {
      const etapa = item.etapa, modelo = item.modelo;
      if (filtroTexto && !(modelo && filtrarModelosSegunBusqueda([modelo], filtroTexto).length)) continue;
      visibles++;
      const m = escapeHtmlAttr(materiaNombre), p = escapeHtmlAttr(procesoNombre), e = escapeHtmlAttr(etapa.nombre);
      html += `
        <li class="etapa-card" data-etapa="${e}">
          <span class="etapa-numero">Etapa ${etapa.numero}</span>
          <h3 class="etapa-titulo">${etapa.nombre}</h3>
          <p class="descripcion-etapa">${etapa.descripcion}</p>
          <div class="modelo-info">
            ${modelo ? `<span class="modelo-titulo">📄 ${escapeHtml(modelo.titulo || 'Sin título')}</span>` : `<span class="modelo-titulo vacio">Ningún modelo asociado</span>`}
            <div class="botones-modelo">
              ${modelo
                ? `<button type="button" class="btn-mostrar" data-modeloid="${modelo.id}" data-materia="${m}" data-proceso="${p}" data-etapa="${e}">Mostrar</button>`
                : `<button type="button" class="btn-crear" data-materia="${m}" data-proceso="${p}" data-etapa="${e}" data-accion="crear">+ Crear modelo</button>`}
            </div>
          </div>
        </li>`;
    }
    html = visibles
      ? '<ol class="etapas">' + html + '</ol><div class="resumen" style="margin-top:1.25rem"><strong>Gestión unificada:</strong> use "Mostrar" para ver, editar o imprimir el documento.</div>'
      : '<div class="resumen">No se encontraron modelos con esa búsqueda.</div>';
    contenedorEtapas.innerHTML = html;

    document.querySelectorAll('.btn-mostrar').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-modeloid');
        const materia = btn.getAttribute('data-materia');
        const proceso = btn.getAttribute('data-proceso');
        const etapa = btn.getAttribute('data-etapa');
        await abrirModalVerDocumento(id, materia, proceso, etapa);
      });
    });
    document.querySelectorAll('[data-accion="crear"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const materia = btn.getAttribute('data-materia');
        const proceso = btn.getAttribute('data-proceso');
        const etapa = btn.getAttribute('data-etapa');
        abrirModalParaCrear(materia, proceso, etapa);
      });
    });
  }

  async function abrirModalVerDocumento(id, materia, proceso, etapa) {
    try {
      const docSnap = await modelosEtapaCollection.doc(id).get();
      if (!docSnap.exists) { alert("El documento ya no existe."); return; }
      const data = docSnap.data();
      currentDocumentoData = { 
        id: id,
        titulo: data.titulo,
        materia: data.materia,
        proceso: data.proceso,
        etapa: data.etapa,
        tipoDocumento: data.tipoDocumento,
        thematic: data.thematic,
        ley: data.ley,
        cuerpo: data.cuerpo,
        materiaContext: materia,
        procesoContext: proceso,
        etapaContext: etapa
      };
      
      const container = document.getElementById('contenidoVerDocumento');
      container.innerHTML = `
        <div class="documento-completo">
          <div class="doc-meta">
            <p><strong>📌 Título:</strong> ${escapeHtml(data.titulo)}</p>
            <p><strong>⚖️ Materia:</strong> ${escapeHtml(data.materia)}</p>
            <p><strong>📂 Proceso:</strong> ${escapeHtml(data.proceso)}</p>
            <p><strong>📑 Etapa:</strong> ${escapeHtml(data.etapa)}</p>
            <p><strong>📄 Tipo documento:</strong> ${escapeHtml(data.tipoDocumento)}</p>
            <p><strong>🏷️ Temática:</strong> ${escapeHtml(data.thematic)}</p>
            <p><strong>📚 Ley:</strong> ${escapeHtml(data.ley || '—')}</p>
          </div>
          <div class="doc-contenido">
            <strong>✍️ Contenido:</strong>
            <div style="margin-top: 10px;">${data.cuerpo || ''}</div>
          </div>
        </div>
      `;
      document.getElementById('modalVerDocumento').style.display = 'flex';
    } catch (error) {
      console.error(error);
      alert("Error al cargar documento: " + error.message);
    }
  }

  function cerrarVerModal() {
    document.getElementById('modalVerDocumento').style.display = 'none';
    currentDocumentoData = null;
  }

  async function editarDesdeVer() {
    if (!currentDocumentoData) return;
    const docData = currentDocumentoData;
    cerrarVerModal();
    await abrirModalParaEditar(docData.id, docData.materiaContext, docData.procesoContext, docData.etapaContext);
  }

  function imprimirDesdeVer() {
    if (currentDocumentoData) {
      imprimirDocumento(currentDocumentoData);
    } else {
      alert("No hay documento cargado");
    }
  }

  function imprimirDocumento(data) {
    const ventana = window.open('', '_blank');
    ventana.document.write(`
      <html><head><title>${escapeHtml(data.titulo)}</title>
      <style>body{font-family: Georgia, 'Times New Roman', serif; padding:2rem;} h1{color:#1e4a6b;} .meta{background:#f4f7fb; padding:10px; border-radius:12px;}</style>
      </head><body>
      <h1>${escapeHtml(data.titulo)}</h1>
      <div class="meta"><strong>Materia:</strong> ${escapeHtml(data.materia)} | <strong>Proceso:</strong> ${escapeHtml(data.proceso)} | <strong>Etapa:</strong> ${escapeHtml(data.etapa)}<br>
      <strong>Temática:</strong> ${escapeHtml(data.thematic)} | <strong>Tipo:</strong> ${escapeHtml(data.tipoDocumento)} | <strong>Ley:</strong> ${escapeHtml(data.ley || '-')}</div>
      <hr><div>${data.cuerpo || ''}</div></body></html>
    `);
    ventana.document.close();
    ventana.print();
  }

  async function abrirModalParaEditar(modelId, materia, proceso, etapa) {
    try {
      const docSnap = await modelosEtapaCollection.doc(modelId).get();
      if (!docSnap.exists) { alert("El modelo ya no existe."); return; }
      const data = docSnap.data();
      document.getElementById('modeloDocId').value = modelId;
      document.getElementById('tituloModelo').value = data.titulo || '';
      document.getElementById('leyModelo').value = data.ley || '';
      document.getElementById('materiaHidden').value = materia;
      document.getElementById('procesoHidden').value = proceso;
      document.getElementById('etapaHidden').value = etapa;
      document.getElementById('materiaModelo').value = data.materia;
      document.getElementById('procesoLibre').value = data.proceso;
      document.getElementById('etapaModelo').value = data.etapa;
      document.getElementById('tipoDocumento').value = data.tipoDocumento || '';
      document.getElementById('thematicModelo').value = data.thematic || '';
      if (quillEditor) quillEditor.clipboard.dangerouslyPasteHTML(data.cuerpo || '');
      document.getElementById('modalTitleModelo').innerText = `Editar: ${data.titulo || 'modelo'}`;
      document.getElementById('modalModelo').style.display = 'flex';
    } catch (error) { console.error(error); alert("Error al cargar datos"); }
  }

  function abrirModalParaCrear(materia, proceso, etapa) {
    document.getElementById('modeloDocId').value = '';
    document.getElementById('tituloModelo').value = '';
    document.getElementById('leyModelo').value = '';
    document.getElementById('tipoDocumento').value = '';
    if (quillEditor) quillEditor.setContents([]);
    document.getElementById('materiaHidden').value = materia;
    document.getElementById('procesoHidden').value = proceso;
    document.getElementById('etapaHidden').value = etapa;
    document.getElementById('materiaModelo').value = materia;
    document.getElementById('procesoLibre').value = proceso;
    document.getElementById('etapaModelo').value = etapa;
    document.getElementById('thematicModelo').value = "";
    document.getElementById('modalTitleModelo').innerText = `Nuevo modelo - ${etapa}`;
    document.getElementById('modalModelo').style.display = 'flex';
  }

  async function guardarModeloDesdeModal(event) {
    event.preventDefault();
    const titulo = document.getElementById('tituloModelo').value.trim();
    const materia = document.getElementById('materiaModelo').value;
    const proceso = document.getElementById('procesoLibre').value.trim();
    const etapa = document.getElementById('etapaModelo').value;
    const tipoDocumento = document.getElementById('tipoDocumento').value;
    const thematic = document.getElementById('thematicModelo').value;
    const ley = document.getElementById('leyModelo').value.trim();
    const cuerpo = quillEditor ? quillEditor.root.innerHTML : '';
    if (!titulo || !materia || !proceso || !etapa || !tipoDocumento || !thematic || !cuerpo) {
      alert("Complete todos los campos obligatorios.");
      return;
    }
    const modeloData = { titulo, materia, proceso, etapa, tipoDocumento, thematic, ley, cuerpo, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
    const docId = document.getElementById('modeloDocId').value || null;
    if (await saveModeloEtapa(modeloData, docId)) {
      cerrarModalModelo();
      await construirSidebarDinamico();
      if (currentMateria === materia && currentProceso === proceso) {
        await renderizarPanelConEtapas(materia, proceso, document.getElementById('searchModelos').value);
      } else {
        const nuevoProceso = document.querySelector(`.proceso-enlace[data-materia="${materia}"][data-proceso="${escapeHtmlAttr(proceso)}"]`);
        if (nuevoProceso) nuevoProceso.click();
        else {
          currentMateria = materia;
          currentProceso = proceso;
          document.getElementById('procesoSeleccionadoNombre').innerText = proceso;
          document.getElementById('subMateriaProceso').innerHTML = `Materia: ${materia} · Modelos por etapa`;
          await renderizarPanelConEtapas(materia, proceso, '');
        }
      }
    }
  }

  function cerrarModalModelo() { document.getElementById('modalModelo').style.display = 'none'; }

  function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

  document.addEventListener('DOMContentLoaded', () => {
    initQuillEditor();
    construirSidebarDinamico();
    
    document.getElementById('btnNuevoModeloGlobal').addEventListener('click', () => abrirModalParaCrear(currentMateria, currentProceso, 'Etapa inicial'));
    
    document.getElementById('closeModalBtnModelo').addEventListener('click', cerrarModalModelo);
    document.getElementById('cancelModalBtn').addEventListener('click', cerrarModalModelo);
    document.getElementById('etapaModelForm').addEventListener('submit', guardarModeloDesdeModal);
    document.getElementById('closeVerModal').addEventListener('click', cerrarVerModal);
    document.getElementById('btnEditarDesdeVer').addEventListener('click', editarDesdeVer);
    document.getElementById('btnImprimirDesdeVer').addEventListener('click', imprimirDesdeVer);
    
    window.addEventListener('click', (e) => {
      if (e.target === document.getElementById('modalModelo')) cerrarModalModelo();
      if (e.target === document.getElementById('modalVerDocumento')) cerrarVerModal();
    });
    
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { cerrarModalModelo(); cerrarVerModal(); } });
    const searchInput = document.getElementById('searchModelos');
    searchInput.addEventListener('input', (e) => {
      if (currentMateria && currentProceso) {
        renderizarPanelConEtapas(currentMateria, currentProceso, e.target.value);
      }
    });
  });
</script>
</body>
</html>
