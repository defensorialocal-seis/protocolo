<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Plazos y Vencimientos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --tinta: #14324b;
    --tinta-2: #22394d;
    --apagado: #5d7388;
    --borde: #dbe3ea;
    --ambar: #f0a020;
    --ambar-suave: #fff3dc;
    --azul-suave: #e8f1f8;
    --acento: #14324b;
    --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
    --sans: 'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --radio: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--sans); background: #fff; color: var(--tinta); line-height: 1.6;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--ambar); outline-offset: 2px; border-radius: 6px; }

  /* Encabezado */
  .cabecera { border-bottom: 1px solid var(--borde); }
  .cabecera-interior {
    max-width: 1280px; margin: 0 auto;
    padding: clamp(1.1rem, 2.5vw, 1.75rem) clamp(1rem, 4vw, 2.5rem);
  }
  .cabecera h1 {
    font-family: var(--serif); font-weight: 600;
    font-size: clamp(1.6rem, 3.6vw, 2.4rem); line-height: 1.1; letter-spacing: -.01em;
  }

  /* Estructura */
  .estructura {
    max-width: 1280px; margin: 0 auto;
    padding: clamp(1rem, 3vw, 2rem) clamp(1rem, 4vw, 2.5rem) 3rem;
    display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr);
    gap: clamp(1.25rem, 3vw, 2.5rem); align-items: start;
  }

  /* Módulos (columna izquierda) */
  .modulos {
    position: sticky; top: 1rem;
    display: flex; flex-direction: column; gap: .5rem; list-style: none;
  }
  .tarjeta-modulo {
    width: 100%; text-align: left; background: #fff;
    border: 1px solid var(--borde); border-left: 5px solid var(--acento);
    border-radius: var(--radio); padding: .85rem 1rem;
    display: grid; grid-template-columns: auto 1fr; gap: .15rem .75rem;
    transition: background .15s, box-shadow .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .tarjeta-modulo:hover { background: #fafcfe; }
  .tarjeta-modulo .num {
    grid-row: 1 / 3; font-family: var(--serif); font-weight: 700; font-size: 1.5rem; line-height: 1;
    color: var(--acento); padding-top: .1rem; min-width: 1.2ch;
  }
  .tarjeta-modulo .modulo-titulo { font-weight: 600; font-size: .95rem; line-height: 1.3; }
  .tarjeta-modulo .modulo-desc { font-size: .8rem; color: var(--apagado); line-height: 1.4; }
  .tarjeta-modulo.activo {
    background: var(--acento); border-color: var(--acento);
    box-shadow: 0 8px 22px -10px var(--acento);
  }
  .tarjeta-modulo.activo .num,
  .tarjeta-modulo.activo .modulo-titulo { color: #fff; }
  .tarjeta-modulo.activo .modulo-desc { color: rgba(255,255,255,.82); }

  /* Panel de detalle (columna derecha) */
  .contenedor-dinamico {
    background: #fff; border: 1px solid var(--borde); border-radius: 22px;
    overflow: hidden; min-height: 60vh; scroll-margin-top: 5rem;
  }
  .encabezado-panel {
    padding: clamp(1.25rem, 3vw, 2.25rem);
    border-top: 6px solid var(--acento); border-bottom: 1px solid var(--borde);
    background: linear-gradient(#fff, #fafcfe);
  }
  .titulo-dinamico {
    font-family: var(--serif); font-weight: 600;
    font-size: clamp(1.5rem, 3.2vw, 2.3rem); line-height: 1.15; letter-spacing: -.005em;
  }
  .subtitulo-area { margin-top: .5rem; color: var(--apagado); font-size: clamp(.9rem, 1.4vw, 1rem); }

  .contenido-right { padding: clamp(1.25rem, 3vw, 2.25rem); max-width: 78ch; }
  .contenido-right.cambio { animation: cambio .28s ease; }
  @keyframes cambio { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .intro { margin-bottom: 1.25rem; color: var(--tinta-2); font-size: clamp(1rem, 1.3vw, 1.0625rem); }

  /* Recursos legales */
  .recursos-grid { display: grid; gap: .65rem; }
  .recurso-card {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .75rem 1rem;
    padding: .9rem 1.1rem; text-decoration: none; color: inherit;
    background: #fafcfe; border: 1px solid var(--borde); border-left: 5px solid var(--acento); border-radius: 12px;
    transition: background .15s, border-color .15s;
  }
  .recurso-card:hover { background: #fff; border-color: var(--acento); }
  .recurso-info h3 { font-family: var(--serif); font-weight: 600; font-size: 1.2rem; line-height: 1.25; color: var(--tinta); margin-bottom: .2rem; }
  .recurso-info p { font-size: .88rem; color: var(--apagado); line-height: 1.45; }
  .recurso-link {
    border: 1.5px solid var(--tinta); border-radius: 999px; padding: .35rem .95rem;
    font-weight: 600; font-size: .85rem; white-space: nowrap; transition: background .15s, color .15s;
  }
  .recurso-card:hover .recurso-link { background: var(--tinta); color: #fff; }

  /* Calculadora */
  .form-calc { display: grid; gap: 1.1rem; }
  .input-group { display: grid; gap: .35rem; }
  .input-group label { font-weight: 600; font-size: .92rem; color: var(--tinta); }
  .input-group input {
    padding: .7rem .9rem; border: 1px solid var(--borde); border-radius: 12px;
    font: inherit; font-size: .97rem; color: var(--tinta-2); background: #fff;
    transition: border-color .15s, box-shadow .15s;
  }
  .input-group input:focus { border-color: var(--ambar); outline: none; box-shadow: 0 0 0 3px rgba(240,160,32,.25); }
  .botones-accion { display: flex; gap: .75rem; flex-wrap: wrap; margin-top: .25rem; }
  .btn-primary, .btn-secondary {
    border-radius: 999px; padding: .6rem 1.3rem; font-weight: 600; font-size: .92rem;
    border: 1.5px solid var(--tinta); transition: background .15s, color .15s;
  }
  .btn-primary { background: var(--tinta); color: #fff; }
  .btn-primary:hover { background: #0e2538; }
  .btn-secondary { background: transparent; color: var(--tinta); }
  .btn-secondary:hover { background: var(--tinta); color: #fff; }
  .btn-primary:active, .btn-secondary:active { transform: scale(.97); }

  .resultado-card {
    margin-top: .5rem; padding: 1rem 1.15rem; line-height: 1.55; font-size: .97rem; color: var(--tinta-2);
    background: var(--azul-suave); border-left: 5px solid var(--tinta); border-radius: 0 var(--radio) var(--radio) 0;
  }
  .resultado-card p + p { margin-top: .5rem; }
  .resultado-card hr { margin: .8rem 0; border: 0; height: 1px; background: #c3d4e2; }
  .error { color: #c4501a; font-weight: 600; }

  .info-extra {
    margin-top: 1.75rem; padding-top: .9rem; border-top: 1px solid var(--borde);
    font-size: .85rem; color: var(--apagado);
  }

  /* Tablet */
  @media (max-width: 1024px) {
    .estructura { grid-template-columns: minmax(230px, 280px) minmax(0, 1fr); }
    .tarjeta-modulo .modulo-desc { display: none; }
    .tarjeta-modulo { align-items: center; }
    .tarjeta-modulo .num { grid-row: auto; }
  }

  /* Móvil: módulos en tira horizontal */
  @media (max-width: 760px) {
    .estructura { grid-template-columns: 1fr; gap: 1rem; }
    .modulos {
      position: sticky; top: 0; z-index: 20; flex-direction: row; overflow-x: auto; gap: .5rem;
      margin: 0 calc(-1 * clamp(1rem, 4vw, 2.5rem)); padding: .6rem clamp(1rem, 4vw, 2.5rem);
      background: rgba(255,255,255,.95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--borde);
      scroll-snap-type: x proximity; scrollbar-width: none;
    }
    .modulos::-webkit-scrollbar { display: none; }
    .modulos li { flex: 1 0 auto; scroll-snap-align: start; }
    .tarjeta-modulo {
      width: 100%; border-left-width: 1px; border-bottom: 4px solid var(--acento);
      padding: .55rem .9rem; display: flex; gap: .5rem; align-items: center; border-radius: 12px;
    }
    .tarjeta-modulo .num { font-size: 1.05rem; }
    .tarjeta-modulo .modulo-titulo { font-size: .85rem; white-space: nowrap; }
    .contenedor-dinamico { min-height: 0; border-radius: 18px; scroll-margin-top: 4.5rem; }
    .recurso-card { flex-direction: column; align-items: flex-start; }
  }
  @media (max-width: 480px) {
    .botones-accion { flex-direction: column; }
    .btn-primary, .btn-secondary { text-align: center; }
  }
  @media (min-width: 1500px) { html { font-size: 17px; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<header class="cabecera">
  <div class="cabecera-interior">
    <h1>Herramientas adicionales</h1>
  </div>
</header>

<div class="estructura">
  <!-- COLUMNA IZQUIERDA : dos módulos principales -->
  <ul class="modulos" aria-label="Herramientas">
    <!-- Módulo 1: Plazos (códigos y leyes) -->
    <li>
      <button class="tarjeta-modulo" type="button" id="moduloPlazos" data-tipo="legislacion" style="--acento:#1e4a6b">
        <span class="num">1</span>
        <span class="modulo-titulo">Plazos · Legislación</span>
        <span class="modulo-desc">Códigos y leyes esenciales: Civil, Comercial, Procesal y normativa provincial Misionera.</span>
      </button>
    </li>
    <!-- Módulo 2: Vencimientos (calculadora) -->
    <li>
      <button class="tarjeta-modulo" type="button" id="moduloVencimientos" data-tipo="calculadora" style="--acento:#d35400">
        <span class="num">2</span>
        <span class="modulo-titulo">Vencimientos · Calculadora</span>
        <span class="modulo-desc">Cómputo de plazos en días hábiles, plazo de gracia y registro de normativa.</span>
      </button>
    </li>
  </ul>

  <!-- COLUMNA DERECHA: contenido dinámico según módulo -->
  <main class="contenedor-dinamico" id="contenedorDinamico" aria-live="polite">
    <div class="encabezado-panel">
      <h2 class="titulo-dinamico" id="tituloDinamico">Cargando...</h2>
      <p class="subtitulo-area" id="subtituloArea"></p>
    </div>
    <div id="dynamicContent" class="contenido-right">
      <!-- carga inicial: por defecto módulo Plazos -->
    </div>
  </main>
</div>

<script>
  // ----------------------------------------------
  // FUNCIONES PARA RENDERIZAR CADA MÓDULO
  // ----------------------------------------------

  // 1. Renderiza el módulo "Plazos" (códigos, leyes, igual que los enlaces del index original)
  function renderModuloLegislacion() {
    return `
      <p class="intro">Acceso directo a normativa vigente para cómputo de plazos procesales y derecho sustancial.</p>
      <div class="recursos-grid">
        <!-- Código Civil y Comercial index style -->
        <a class="recurso-card" href="https://admindefensoria6.github.io/CodigoCivilComercial/" target="_blank" rel="noopener noreferrer">
          <div class="recurso-info">
            <h3>⚖️ Código Civil y Comercial de la Nación</h3>
            <p>Normas de fondo · plazos generales, prescripción, caducidad, responsabilidad civil.</p>
          </div>
          <span class="recurso-link">Consultar →</span>
        </a>
        <!-- Ley XII-27 Misiones (Familia y Violencia) -->
        <a class="recurso-card" href="https://defensorialocal-seis.github.io/LEYmisiones/" target="_blank" rel="noopener noreferrer">
          <div class="recurso-info">
            <h3>⚖️ Ley XII-27 CCyCFVF · Misiones</h3>
            <p>Código de Familia, Violencia Familiar, plazos procesales especiales en la provincia.</p>
          </div>
          <span class="recurso-link">Explorar →</span>
        </a>
        <!-- CPCCN (Código Procesal Civil y Comercial Nación) -->
        <a class="recurso-card" href="https://defensorialocal-seis.github.io/CPCCN/" target="_blank" rel="noopener noreferrer">
          <div class="recurso-info">
            <h3>⚖️ C.P.C.C. de la Nación</h3>
            <p>Procedimientos, términos judiciales, cómputo de plazos, apelaciones y recursos.</p>
          </div>
          <span class="recurso-link">Acceder →</span>
        </a>
      </div>
      <div class="info-extra">
        📌 Estos códigos contienen las bases para determinar plazos procesales según cada fuero. Consulte siempre la última reforma.
      </div>
    `;
  }

  // 2. Renderiza la calculadora de vencimientos (tomada de index original, similar funcionalidad)
  // Se genera HTML y luego se asignan eventos
  function renderModuloCalculadora() {
    return `
      <div class="calc-wrapper">
        <div class="form-calc">
          <div class="input-group">
            <label for="fechaNotificacionCalc">📅 Fecha de Notificación / Proveído:</label>
            <input type="date" id="fechaNotificacionCalc" value="">
          </div>
          <div class="input-group">
            <label for="plazoDiasCalc">📅 Plazo en días hábiles:</label>
            <input type="number" id="plazoDiasCalc" min="1" value="5" step="1">
          </div>
          <div class="input-group">
            <label for="tipoEscritoCalc">📅 Tipo de Escrito / Resolución / Sentencia:</label>
            <input type="text" id="tipoEscritoCalc" placeholder="Ej: Contestación demanda, Recurso de apelación, Excepción previa">
          </div>
          <div class="input-group">
            <label for="normativaCalc">📅 Normativa de referencia aplicable:</label>
            <input type="text" id="normativaCalc" placeholder="Ej: Art. 347 CPC Misiones, Art. 158 CPCCN">
          </div>
          <div class="botones-accion">
            <button class="btn-primary" type="button" id="btnCalcularVencimiento">🔎 Calcular vencimiento</button>
            <button class="btn-secondary" type="button" id="btnImprimirCalculo">🖨️ Imprimir resultado</button>
          </div>
          <div id="resultadoVencimiento" class="resultado-card">
            <p>Complete los datos y presione "Calcular vencimiento".</p>
          </div>
        </div>
      </div>
      <div class="info-extra">
        📆 El cómputo excluye sábados, domingos y feriados automáticos (base días hábiles). Plazo de gracia: día hábil siguiente hasta las 08:59 hs.
      </div>
    `;
  }

  // Función que ejecuta el cálculo de plazos (estilo index original, actualizado)
  function calcularPlazoHandler() {
    // obtener referencias de los campos dentro del contenedor dinámico
    const fechaInput = document.getElementById('fechaNotificacionCalc');
    const plazoInput = document.getElementById('plazoDiasCalc');
    const tipoEscrito = document.getElementById('tipoEscritoCalc');
    const normativa = document.getElementById('normativaCalc');
    const resultadoDiv = document.getElementById('resultadoVencimiento');

    if (!fechaInput || !plazoInput) {
      if (resultadoDiv) resultadoDiv.innerHTML = '<p class="error">Error: no se encontraron campos de la calculadora.</p>';
      return;
    }

    const fechaStr = fechaInput.value;
    const plazoDias = parseInt(plazoInput.value);
    const tipoTexto = tipoEscrito ? tipoEscrito.value : '';
    const normativaTexto = normativa ? normativa.value : '';

    if (!fechaStr || isNaN(plazoDias) || plazoDias <= 0) {
      resultadoDiv.innerHTML = '<p class="error">📌 Complete fecha y plazo válido (mayor a 0).</p>';
      return;
    }

    // Lógica de cómputo días hábiles (excluye sábados/domingos) iniciando al día siguiente de la notificación.
    let fecha = new Date(fechaStr + 'T00:00:00');
    let diasRestantes = plazoDias;

    // avanzar al día siguiente (por notificación luego del día)
    fecha.setDate(fecha.getDate() + 1);

    while (diasRestantes > 0) {
      const diaSemana = fecha.getDay();
      if (diaSemana !== 0 && diaSemana !== 6) {
        diasRestantes--;
      }
      if (diasRestantes > 0) {
        fecha.setDate(fecha.getDate() + 1);
      }
    }

    const fechaVencimiento = new Date(fecha);
    // formato español
    const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    const fechaVencimientoStr = fechaVencimiento.toLocaleDateString('es-ES', opciones);

    // Cálculo del plazo de gracia: día hábil siguiente al vencimiento a las 08:59
    let fechaGracia = new Date(fechaVencimiento);
    fechaGracia.setDate(fechaGracia.getDate() + 1);
    while (fechaGracia.getDay() === 0 || fechaGracia.getDay() === 6) {
      fechaGracia.setDate(fechaGracia.getDate() + 1);
    }
    const fechaGraciaStr = fechaGracia.toLocaleDateString('es-ES', opciones);

    const horaVencimiento = '12:00 hs.';
    const horaGracia = '08:59 hs.';

    let htmlResultado = '';
    if (tipoTexto) htmlResultado += `<p><strong>📌 Tipo:</strong> ${tipoTexto}</p>`;
    if (normativaTexto) htmlResultado += `<p><strong>📖 Normativa:</strong> ${normativaTexto}</p>`;
    if (tipoTexto || normativaTexto) htmlResultado += `<hr>`;

    htmlResultado += `
      <p>El plazo de <strong>${plazoDias}</strong> días hábiles vence el:</p>
      <p><strong><span style="color:#1f6e43; font-size:1.05rem;">📆 ${fechaVencimientoStr}</span></strong> a las <strong><span style="color:#1f6e43;">${horaVencimiento}</span></strong></p>
      <p style="margin-top: 12px;">⏳ Plazo de gracia (prórroga automática):</p>
      <p><strong><span style="color:#d35400;">${fechaGraciaStr}</span></strong> a las <strong><span style="color:#d35400;">${horaGracia}</span></strong></p>
      <hr>
      <p style="font-size:0.85rem;">✅ Recuerde: el cómputo se realiza en días hábiles judiciales, sin considerar feriados automáticos. Siempre verifique feriados locales.</p>
    `;

    resultadoDiv.innerHTML = htmlResultado;
  }

  // función de impresión: imprime el resultado con el contexto de la consulta
  function imprimirResultado() {
    const resultadoBloque = document.getElementById('resultadoVencimiento');
    if (!resultadoBloque) {
      window.print();
      return;
    }
    const printContent = resultadoBloque.cloneNode(true);
    // También tomamos los datos principales de tipo y normativa para que tenga contexto
    const tipoEscrito = document.getElementById('tipoEscritoCalc')?.value || '';
    const normativaTexto = document.getElementById('normativaCalc')?.value || '';
    const fechaNotif = document.getElementById('fechaNotificacionCalc')?.value || '';
    const plazoValor = document.getElementById('plazoDiasCalc')?.value || '';

    const ventanaPrint = window.open('', '_blank');
    ventanaPrint.document.write(`
      <html>
        <head><title>Vencimiento - Defensoría</title>
        <style>
          body { font-family: 'Public Sans', Arial, sans-serif; padding: 2rem; max-width: 700px; margin: 0 auto; color: #14324b; }
          h2 { color: #14324b; border-bottom: 2px solid #f0a020; }
          .card-result { background: #f9f9fb; padding: 1rem; border-radius: 16px; margin-top: 1rem; }
          .fecha { font-weight: bold; color: #1f6e43; }
        </style>
        </head>
        <body>
          <h2>📄 Cálculo de vencimiento procesal</h2>
          <p><strong>Fecha de notificación:</strong> ${fechaNotif || '—'}</p>
          <p><strong>Plazo (días hábiles):</strong> ${plazoValor}</p>
          ${tipoEscrito ? `<p><strong>Tipo de escrito:</strong> ${tipoEscrito}</p>` : ''}
          ${normativaTexto ? `<p><strong>Normativa:</strong> ${normativaTexto}</p>` : ''}
          <div class="card-result">
            ${printContent.innerHTML}
          </div>
          <p style="margin-top: 2rem; font-size: 0.7rem;">Documento generado por Sistema de Plazos y Vencimientos - Defensoría Oficial</p>
        </body>
      </html>
    `);
    ventanaPrint.document.close();
    ventanaPrint.print();
    ventanaPrint.onafterprint = () => ventanaPrint.close();
  }

  // Adjuntar eventos a la calculadora después de inyectar el HTML
  function attachCalculadoraEvents() {
    const btnCalcular = document.getElementById('btnCalcularVencimiento');
    const btnImprimir = document.getElementById('btnImprimirCalculo');

    if (btnCalcular) {
      btnCalcular.addEventListener('click', (e) => {
        e.preventDefault();
        calcularPlazoHandler();
      });
    }

    if (btnImprimir) {
      btnImprimir.addEventListener('click', (e) => {
        e.preventDefault();
        imprimirResultado();
      });
    }

    // Si hay valores por defecto opcional: poner fecha actual para comodidad
    const fechaField = document.getElementById('fechaNotificacionCalc');
    if (fechaField && !fechaField.value) {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      fechaField.value = `${yyyy}-${mm}-${dd}`;
    }
  }

  // FUNCIÓN PRINCIPAL: cambiar contenido según módulo activo
  let currentModule = 'legislacion';   // 'legislacion' o 'calculadora'

  function setActiveModule(moduleType) {
    currentModule = moduleType;
    // Actualizar estilos visuales de las tarjetas izquierdas
    const moduloLegis = document.getElementById('moduloPlazos');
    const moduloCalc = document.getElementById('moduloVencimientos');
    const activa = moduleType === 'legislacion' ? moduloLegis : moduloCalc;
    if (moduloLegis && moduloCalc) {
      moduloLegis.classList.toggle('activo', moduleType === 'legislacion');
      moduloCalc.classList.toggle('activo', moduleType !== 'legislacion');
      moduloLegis.setAttribute('aria-current', moduleType === 'legislacion');
      moduloCalc.setAttribute('aria-current', moduleType !== 'legislacion');
      // el panel toma el color del módulo activo
      document.getElementById('contenedorDinamico').style.setProperty('--acento', activa.style.getPropertyValue('--acento'));
    }

    const dynamicContainer = document.getElementById('dynamicContent');
    if (!dynamicContainer) return;

    const titulo = document.getElementById('tituloDinamico');
    const subtitulo = document.getElementById('subtituloArea');
    dynamicContainer.className = 'contenido-right cambio';

    if (moduleType === 'legislacion') {
      subtitulo.innerText = 'Recursos de consulta forense';
      titulo.innerText = '📌 Códigos y Leyes de Plazos';
      dynamicContainer.innerHTML = renderModuloLegislacion();
    } else {
      subtitulo.innerText = 'Herramienta de cómputo judicial';
      titulo.innerText = '📌 Calculadora de Vencimientos';
      dynamicContainer.innerHTML = renderModuloCalculadora();
      // Luego de renderizar, adjuntar eventos de la calculadora
      attachCalculadoraEvents();
    }
  }

  // Eventos de click en tarjetas laterales
  function initEventos() {
    const plazosCard = document.getElementById('moduloPlazos');
    const vencimientosCard = document.getElementById('moduloVencimientos');
    const enMovil = () => window.matchMedia('(max-width:760px)').matches;

    const activar = (tarjeta, modulo) => {
      setActiveModule(modulo);
      tarjeta.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
      if (enMovil()) document.getElementById('contenedorDinamico').scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    if (plazosCard) {
      plazosCard.addEventListener('click', (e) => {
        e.stopPropagation();
        activar(plazosCard, 'legislacion');
      });
    }

    if (vencimientosCard) {
      vencimientosCard.addEventListener('click', (e) => {
        e.stopPropagation();
        activar(vencimientosCard, 'calculadora');
      });
    }
  }

  // Carga inicial: módulo Plazos (Legislación) activo por defecto
  function inicio() {
    initEventos();
    setActiveModule('legislacion');
  }

  inicio();
</script>
</body>
</html>
